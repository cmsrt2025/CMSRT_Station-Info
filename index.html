<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <title>CMSRT Station Info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  
  <link rel="stylesheet" href="app.css"/>
</head>

<body>

<div id="loading" class="loading">กำลังโหลดข้อมูล</div>

<button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>🚉 CMSRT Station Info </h2>
    <p>ระบบติดตามสถานะสถานีรถไฟ</p>
    <a class="update-data-btn" id="updateDataBtn" href="#">Update Data</a>
  </div>

  <div class="sidebar-content">
    <div class="filter-section">
      <div class="section-title">
        <h3>🎛️ MAP Style</h3>
        <label class="label-toggle">
          <input type="checkbox" id="showLabels">
          Show label
        </label>
      </div>
      <div class="filter-group" id="filter_Layer">
        <div class="filter-group-header active" onclick="toggleDropdown('Layer')">
          <div class="filter-group-title">
            <span class="dropdown-arrow open">▼</span>
            <label>Layer</label>
          </div>
        </div>
        <div class="checkbox-group show" id="styleSelector">
          <div class="checkbox-item">
            <input type="radio" name="styleMode" id="styleBase" value="base" checked>
            <label for="styleBase">Base map</label>
          </div>
          <div class="checkbox-item">
            <input type="radio" name="styleMode" id="styleOptical" value="optical">
            <label for="styleOptical">Optical Layer</label>
          </div>
          <div class="checkbox-item">
            <input type="radio" name="styleMode" id="styleMpls" value="mpls">
            <label for="styleMpls">MPLS Layer</label>
          </div>
          <div class="checkbox-item installation-style-item">
            <input type="radio" name="styleMode" id="styleInstallation" value="installation">
            <label for="styleInstallation">Installation Status</label>
          </div>
          <div class="installation-mode-options" id="installationModeOptions">
            <div class="installation-mode-options-list">
              <div class="checkbox-item installation-option-item">
                <input type="checkbox" id="showInstallationStations" checked>
                <label for="showInstallationStations">Indoor</label>
              </div>
              <div class="checkbox-item installation-option-item">
                <input type="checkbox" id="showInstallationLines" checked>
                <label for="showInstallationLines">Outdoor</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="filter-section">
      <h3>🔍 ค้นหา</h3>
      <div class="filter-group">
        <label>ชื่อสถานี or ลำดับตาม TOR</label>
        <input type="text" id="searchBox" placeholder="พิมพ์ชื่อสถานีหรือหมายเลข...">
      </div>
    </div>

    <div class="filter-section">
      <div class="section-title" id="openFilterModal">
        <h3>⚙️ Filter</h3>
        <span class="dropdown-arrow">▼</span>
      </div>
      <div id="dynamicFilters">
        <!-- Filters will be generated here automatically -->
      </div>
      <button class="btn-reset" onclick="resetFilters()">รีเซ็ตทั้งหมด</button>
    </div>

    <div class="station-count" id="stationCount">
      แสดง: 0 สถานี
    </div>
  </div>
</div>

<div id="map"></div>

<div id="legend"></div>

<div class="map-switch">
  <button class="map-btn active" onclick="changeLayer('street')">🗺️ แผนที่ถนน</button>
  <button class="map-btn" onclick="changeLayer('satellite')">🛰️ ดาวเทียม</button>
</div>

<div class="filter-modal-overlay" id="filterModalOverlay" aria-hidden="true">
  <div class="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filterModalTitle">
    <div class="filter-modal-header">
      <div class="filter-modal-title" id="filterModalTitle">เลือกหัวข้อ Filter</div>
      <button class="filter-modal-close" id="filterModalClose" aria-label="Close">×</button>
    </div>
    <div class="filter-modal-actions">
      <button class="select-all-btn" id="filterSelectAllBtn">ทั้งหมด</button>
      <button class="select-all-btn" id="filterSelectNoneBtn">ไม่เลือก</button>
    </div>
    <div class="filter-modal-list" id="filterSelectorList"></div>
  </div>
</div>



  <script src="app.js" defer></script>
</body>
</html>
